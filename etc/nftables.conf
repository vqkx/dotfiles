#!/usr/sbin/nft -f

flush ruleset

table ip6 nat {
   chain prerouting {
      type nat hook prerouting priority dstnat;
      tcp dport 88888 dnat to [2606:4700:4700::1111]:11111
      udp dport 88888 dnat to [2606:4700:4700::1111]:11111
   }
   chain postrouting {
      type nat hook postrouting priority srcnat;
      ip6 daddr 2606:4700:4700::1111 tcp dport 11111 snat to 2001:4860:4860::8888
      ip6 daddr 2606:4700:4700::1111 udp dport 11111 snat to 2001:4860:4860::8888
   }
}
